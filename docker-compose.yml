services:
  postgres:
    image: postgres:17-alpine
    container_name: frontwing-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frontwing
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/backup_frontwing_pre_clean.sql:/docker-entrypoint-initdb.d/00_init_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d frontwing"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - frontwing-network

  redis:
    image: redis:7-alpine
    container_name: frontwing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - frontwing-network

  ai_services:
    build:
      context: ./ai_services
      dockerfile: Dockerfile
    container_name: frontwing-ai-services
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      PORT: 8000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/frontwing
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LOG_LEVEL: INFO
      LLM_CACHE_ENABLED: "true"
      OPENF1_BASE_URL: https://api.openf1.org/v1
    volumes:
      - fastf1_cache:/app/cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - frontwing-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: frontwing-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/frontwing
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai_services:8000
      JWT_SECRET: ${JWT_SECRET:-f1_frontwing_super_secret_jwt_key_2026_telemetry_secure}
      JWT_EXPIRES_IN: 7d
      LOG_LEVEL: info
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_services:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/hero/current"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - frontwing-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontwing-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - frontwing-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  fastf1_cache:
    driver: local

networks:
  frontwing-network:
    driver: bridge
